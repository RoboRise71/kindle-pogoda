name: Kindle dashboard

# Łańcuch: każde uruchomienie generuje obrazek, czeka do następnego :00 / :30
# i samo odpala kolejne. Harmonogram cron jest tylko zapasem, gdyby łańcuch się przerwał.
on:
  schedule:
    - cron: "7 */2 * * *"     # zapas co 2 godziny
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Nowe uruchomienie anuluje stare, więc zawsze działa tylko jeden łańcuch.
concurrency:
  group: kindle-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: mkdir -p site && python generate.py site/dashboard.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Czekaj do następnego :00 / :30
        run: |
          now=$(date +%s)
          next=$(( (now / 1800 + 1) * 1800 ))
          wait=$(( next - now - 60 ))
          [ $wait -lt 60 ] && wait=$(( wait + 1800 ))
          echo "Czekam ${wait}s"
          sleep $wait
      - name: Uruchom kolejny przebieg
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard.yml --repo "${{ github.repository }}" --ref main
